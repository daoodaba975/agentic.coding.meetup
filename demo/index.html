<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quote Dev</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f13;
      color: #e2e2e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #7c6af7;
      margin-bottom: 48px;
    }

    /* --- Quote card --- */
    .card {
      background: #18181f;
      border: 1px solid #2a2a35;
      border-radius: 16px;
      padding: 40px 36px;
      max-width: 640px;
      width: 100%;
      text-align: center;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.25s;
    }

    .card.loading { opacity: 0.4; }

    blockquote {
      font-size: 1.25rem;
      line-height: 1.7;
      color: #e2e2e8;
      font-style: italic;
      position: relative;
      padding: 0 12px;
    }

    blockquote::before {
      content: '"';
      font-size: 3rem;
      color: #7c6af7;
      position: absolute;
      top: -12px;
      left: -8px;
      line-height: 1;
      font-style: normal;
    }

    .author {
      font-size: 0.9rem;
      color: #7c6af7;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    /* --- Button --- */
    .btn {
      margin-top: 24px;
      padding: 12px 28px;
      background: #7c6af7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover { background: #6b58e8; }
    .btn:active { transform: scale(0.97); }

    /* --- Divider --- */
    .divider {
      width: 100%;
      max-width: 640px;
      border: none;
      border-top: 1px solid #2a2a35;
      margin: 48px 0;
    }

    /* --- Form --- */
    .form-section {
      width: 100%;
      max-width: 640px;
    }

    .form-section h2 {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6b6b80;
      margin-bottom: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    input, textarea {
      background: #18181f;
      border: 1px solid #2a2a35;
      border-radius: 8px;
      padding: 12px 16px;
      color: #e2e2e8;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      resize: vertical;
    }

    input::placeholder, textarea::placeholder { color: #44445a; }
    input:focus, textarea:focus { border-color: #7c6af7; }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row input { flex: 1; }

    .btn-submit {
      align-self: flex-end;
      padding: 11px 24px;
      background: transparent;
      border: 1px solid #7c6af7;
      color: #7c6af7;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .btn-submit:hover { background: #7c6af7; color: #fff; }

    /* --- Toast --- */
    .toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: #22c55e;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
    }

    .toast.error { background: #ef4444; }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <h1>Quote Dev</h1>

  <div class="card" id="card">
    <blockquote id="quote-text">Chargement...</blockquote>
    <p class="author" id="quote-author"></p>
  </div>

  <button class="btn" id="btn-new">Nouvelle citation</button>

  <hr class="divider" />

  <section class="form-section">
    <h2>Ajouter une citation</h2>
    <form id="add-form">
      <textarea id="text" placeholder="Citation..." rows="3" required></textarea>
      <div class="form-row">
        <input id="author" type="text" placeholder="Auteur" required />
        <button type="submit" class="btn-submit">Ajouter</button>
      </div>
    </form>
  </section>

  <div class="toast" id="toast"></div>

  <script>
    const quoteText = document.getElementById('quote-text');
    const quoteAuthor = document.getElementById('quote-author');
    const card = document.getElementById('card');
    const toast = document.getElementById('toast');

    async function loadQuote() {
      card.classList.add('loading');
      try {
        const res = await fetch('/quote');
        const data = await res.json();
        quoteText.textContent = data.text;
        quoteAuthor.textContent = '— ' + data.author;
      } catch {
        quoteText.textContent = 'Impossible de charger la citation.';
        quoteAuthor.textContent = '';
      } finally {
        card.classList.remove('loading');
      }
    }

    function showToast(msg, isError = false) {
      toast.textContent = msg;
      toast.className = 'toast' + (isError ? ' error' : '') + ' show';
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    document.getElementById('btn-new').addEventListener('click', loadQuote);

    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = document.getElementById('text').value.trim();
      const author = document.getElementById('author').value.trim();
      try {
        const res = await fetch('/quotes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, author })
        });
        if (!res.ok) throw new Error();
        showToast('Citation ajoutée !');
        e.target.reset();
      } catch {
        showToast('Erreur lors de l\'ajout.', true);
      }
    });

    loadQuote();
  </script>
</body>
</html>
